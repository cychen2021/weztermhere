[package]
name = "weztermhere"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "weztermhere_shell"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.62.2"
